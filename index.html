        const SUPABASE_URL = 'https://buxyihdvmdaltvwzdmez.supabase.co';  // <-- sostituisci
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1eHlpaGR2bWRhbHR2d3pkbWV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTQyMDUsImV4cCI6MjA5NjA3MDIwNX0.JifKRtrM1ZJowQ7Qebi-60eY9jG4XLer7FnvWp-wHj8';            // <-- sostituisci
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // =====================================

        const AUTH_KEY = 'vd_auth';
        const PASSWORD = '080219';

        function LoginScreen({ onSuccess }) {
          const [pwd, setPwd] = useState('');
          const [error, setError] = useState(false);

          useEffect(() => {
            if (pwd.length === 6) {
              if (pwd === PASSWORD) {
                localStorage.setItem(AUTH_KEY, '1');
                onSuccess();
              } else {
                setError(true);
                setTimeout(() => {
                  setPwd('');
                  setError(false);
                }, 600);
              }
            }
          }, [pwd, onSuccess]);

          const handleAddDigit = (digit) => {
            if (pwd.length < 6) {
              setPwd(prev => prev + digit);
              setError(false);
            }
          };

          const handleDelete = () => {
            setPwd(prev => prev.slice(0, -1));
            setError(false);
          };

          // Supporto tastiera fisica (desktop)
          useEffect(() => {
            const onKey = (e) => {
              if (e.key >= '0' && e.key <= '9') handleAddDigit(e.key);
              else if (e.key === 'Backspace') handleDelete();
            };
            window.addEventListener('keydown', onKey);
            return () => window.removeEventListener('keydown', onKey);
          }, [pwd]);

          return (
            <div className="min-h-screen bg-[#323232] flex flex-col items-center justify-center p-6 select-none relative overflow-hidden">
              {/* Background Glow */}
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-emerald-600/10 blur-[120px] rounded-full pointer-events-none"></div>
              
              {/* Header */}
              <div className="text-center mb-10 relative z-10">
                <img src="./roadiario-mark.svg" alt="il roadiario" className="h-24 w-auto mx-auto mb-8 animate-float" />
                <p className="text-stone-500 font-medium">Benvenuto. Digita il tuo codice.</p>
              </div>

              {/* Dots */}
              <div className={`flex gap-5 mb-16 relative z-10 transition-transform ${error ? 'animate-shake' : ''}`}>
                {[...Array(6)].map((_, i) => (
                  <div
                    key={i}
                    className={`w-3.5 h-3.5 rounded-full border-2 transition-all duration-300 ${
                      i < pwd.length 
                        ? (error ? 'bg-red-500 border-red-500' : 'bg-white border-white scale-110 shadow-[0_0_15px_rgba(255,255,255,0.5)]') 
                        : 'border-stone-700'
                    }`}
                  />
                ))}
              </div>

              {/* Keypad */}
              <div className="grid grid-cols-3 gap-6 md:gap-8 relative z-10">
                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                  <button
                    key={num}
                    onClick={() => handleAddDigit(num.toString())}
                    className="w-20 h-20 md:w-24 md:h-24 rounded-full bg-stone-900/50 border border-white/5 backdrop-blur-lg hover:bg-stone-800/80 active:scale-90 flex items-center justify-center text-3xl font-medium text-white transition-all duration-200"
                  >
                    {num}
                  </button>
                ))}
                <div className="w-20 h-20 md:w-24 md:h-24" /> {/* Spacer */}
                <button
                  onClick={() => handleAddDigit('0')}
                  className="w-20 h-20 md:w-24 md:h-24 rounded-full bg-stone-900/50 border border-white/5 backdrop-blur-lg hover:bg-stone-800/80 active:scale-90 flex items-center justify-center text-3xl font-medium text-white transition-all duration-200"
                >
                  0
                </button>
                <button
                  onClick={handleDelete}
                  className={`w-20 h-20 md:w-24 md:h-24 flex items-center justify-center text-base font-bold text-stone-500 hover:text-white transition-all active:scale-95 ${pwd.length === 0 ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
                >
                  Cancella
                </button>
              </div>

              <style>{`
                @keyframes shake {
                  0%, 100% { transform: translateX(0); }
                  20% { transform: translateX(-10px); }
                  40% { transform: translateX(10px); }
                  60% { transform: translateX(-7px); }
                  80% { transform: translateX(7px); }
                }
                .animate-shake {
                  animation: shake 0.4s ease-in-out;
                }
              `}</style>
            </div>
          );
        }

        function VanDiaryApp() {
          const [authed, setAuthed] = useState(() => localStorage.getItem(AUTH_KEY) === '1');
          const [memories, setMemories] = useState([]);
          const [activeTab, setActiveTab] = useState('timeline');
          const [selectedPinInfo, setSelectedPinInfo] = useState(null);
          const [counterEvents, setCounterEvents] = useState([]);
          const [reactions, setReactions] = useState([]);
          const [loading, setLoading] = useState(true);
          const [saving, setSaving] = useState(false);
          const [loadError, setLoadError] = useState(false);
          const [gameLevel, setGameLevel] = useState('tutte');
          const [currentQ, setCurrentQ] = useState(null);
          const [qSpin, setQSpin] = useState(false);
          const [gameMode, setGameMode] = useState('preferiresti');
          const [mlQ, setMlQ] = useState(null);
          const [tdCard, setTdCard] = useState(null);
          const [chCard, setChCard] = useState(null);
          const [spinName, setSpinName] = useState(null);
          const [spinning, setSpinning] = useState(false);
          const spinRef = useRef(null);
          const [riskMax, setRiskMax] = useState(5);
          const [riskPhase, setRiskPhase] = useState('idle');
          const riskRef = useRef(null);
          const [vanPos, setVanPos] = useState(null);
          const [vanFollow, setVanFollow] = useState(false);
          const [vanBusy, setVanBusy] = useState(false);
          const [geoMsg, setGeoMsg] = useState('');
          const [showLegend, setShowLegend] = useState(false);

          const gameLevels = useMemo(() => [
            { id: 'tutte', label: 'Tutte', icon: 'shuffle', color: 'text-stone-700', bg: 'bg-stone-100/60', hex: '#44403c' },
            { id: 'facile', label: 'Facile', icon: 'face-laugh', color: 'text-emerald-600', bg: 'bg-emerald-100/60', hex: '#059669' },
            { id: 'medio', label: 'Medio', icon: 'users', color: 'text-amber-600', bg: 'bg-amber-100/60', hex: '#d97706' },
            { id: 'difficile', label: 'Estremo', icon: 'skull', color: 'text-red-600', bg: 'bg-red-100/60', hex: '#dc2626' },
          ], []);

          const questionPool = useMemo(() => {
            const all = (typeof window !== 'undefined' && window.VD_QUESTIONS) || [];
            return gameLevel === 'tutte' ? all : all.filter(q => q.l === gameLevel);
          }, [gameLevel]);

          const nextQuestion = () => {
            if (!questionPool.length) { setCurrentQ(null); return; }
            let q = currentQ;
            for (let i = 0; i < 8 && (q === currentQ); i++) {
              q = questionPool[Math.floor(Math.random() * questionPool.length)];
              if (questionPool.length === 1) break;
            }
            setQSpin(true);
            setCurrentQ(q);
            setTimeout(() => setQSpin(false), 220);
          };

          // Nuova domanda al primo accesso e a ogni cambio livello
          useEffect(() => {
            if (questionPool.length) {
              setCurrentQ(questionPool[Math.floor(Math.random() * questionPool.length)]);
            } else {
              setCurrentQ(null);
            }
          }, [gameLevel]);

          // ===== Hub giochi di gruppo =====
          const TEAM = useMemo(() => ['Leonardo', 'Simona', 'Simone', 'Alessandra', 'Stefano', 'Mattia', 'Martina', 'Bruno'], []);
          const gameModes = useMemo(() => [
            { id: 'preferiresti', label: 'Preferiresti', icon: 'code-branch' },
            { id: 'mostlikely', label: 'Chi è più probabile', icon: 'hand-point-right' },
            { id: 'truthdare', label: 'Verità o Obbligo', icon: 'masks-theater' },
            { id: 'spinner', label: 'Estrai un membro', icon: 'arrows-spin' },
            { id: 'risk', label: 'Quanto te la rischi', icon: 'dice-five' },
            { id: 'challenge', label: 'Sfide', icon: 'fire-flame-curved' },
          ], []);

          const pickFrom = (arr, prev) => {
            if (!arr || !arr.length) return null;
            if (arr.length === 1) return arr[0];
            let v = prev;
            for (let i = 0; i < 8 && v === prev; i++) v = arr[Math.floor(Math.random() * arr.length)];
            return v;
          };

          const nextMostLikely = () => { setMlQ(pickFrom((window.VD_GAMES || {}).mostLikely, mlQ)); };
          const drawTruthDare = (kind) => {
            const pool = (window.VD_GAMES || {})[kind === 'truth' ? 'truth' : 'dare'];
            setTdCard({ kind, text: pickFrom(pool, tdCard && tdCard.text) });
          };
          const nextChallenge = () => { setChCard(pickFrom((window.VD_GAMES || {}).challenges, chCard)); };

          // "Quanto te la rischi": countdown 3-2-1-VIA per dire il numero in sincrono.
          const startRisk = () => {
            clearTimeout(riskRef.current);
            const seq = ['3', '2', '1', 'go'];
            let i = 0;
            setRiskPhase(seq[0]);
            const step = () => {
              i++;
              if (i < seq.length) {
                setRiskPhase(seq[i]);
                riskRef.current = setTimeout(step, 850);
              } else {
                riskRef.current = setTimeout(() => setRiskPhase('idle'), 3000);
              }
            };
            riskRef.current = setTimeout(step, 850);
          };
          const adjustRisk = (d) => setRiskMax(v => Math.min(20, Math.max(2, v + d)));

          const spinMember = () => {
            if (spinning) return;
            setSpinning(true);
            let ticks = 0;
            const total = 16 + Math.floor(Math.random() * 8);
            clearInterval(spinRef.current);
            spinRef.current = setInterval(() => {
              setSpinName(TEAM[Math.floor(Math.random() * TEAM.length)]);
              ticks++;
              if (ticks >= total) {
                clearInterval(spinRef.current);
                setSpinName(TEAM[Math.floor(Math.random() * TEAM.length)]);
                setSpinning(false);
              }
            }, 80);
          };

          // Inizializza la carta quando cambi modalità
          useEffect(() => {
            const G = window.VD_GAMES || {};
            if (gameMode === 'mostlikely' && !mlQ) setMlQ(pickFrom(G.mostLikely));
            if (gameMode === 'challenge' && !chCard) setChCard(pickFrom(G.challenges));
          }, [gameMode]);

          useEffect(() => () => { clearInterval(spinRef.current); clearTimeout(riskRef.current); }, []);

          const counterConfig = useMemo(() => [
            { key: 'caffe', label: 'Caffè', icon: 'mug-hot', color: 'text-amber-700', bg: 'bg-amber-100/50', border: 'border-amber-200/50', hex: '#b45309' },
            { key: 'bruno', label: 'Bruno', icon: 'dog', color: 'text-orange-600', bg: 'bg-orange-100/50', border: 'border-orange-200/50', hex: '#ea580c' },
            { key: 'bestemmie', label: 'Bestemmie', icon: 'bolt', color: 'text-red-600', bg: 'bg-red-100/50', border: 'border-red-200/50', hex: '#dc2626' },
            { key: 'strada', label: 'Strada sbagliata', icon: 'map-pin', color: 'text-purple-600', bg: 'bg-purple-100/50', border: 'border-purple-200/50', hex: '#9333ea' },
            { key: 'sbadigli', label: 'Sbadigli', icon: 'face-tired', color: 'text-blue-600', bg: 'bg-blue-100/50', border: 'border-blue-200/50', hex: '#2563eb' },
            { key: 'ritardi', label: 'Ritardi', icon: 'clock', color: 'text-yellow-600', bg: 'bg-yellow-100/50', border: 'border-yellow-200/50', hex: '#ca8a04' },
            { key: 'sigarette', label: 'Sigarette', icon: 'smoking', color: 'text-stone-600', bg: 'bg-stone-200/50', border: 'border-stone-300/50', hex: '#57534e' },
            { key: 'pipi', label: 'Soste pipì', icon: 'droplet', color: 'text-cyan-600', bg: 'bg-cyan-100/50', border: 'border-cyan-200/50', hex: '#0891b2' },
            { key: 'alcool', label: 'Alcool', icon: 'wine-glass', color: 'text-rose-600', bg: 'bg-rose-100/50', border: 'border-rose-200/50', hex: '#e11d48' },
            { key: 'scaffe', label: 'Scaffe prese', icon: 'hand-back-fist', color: 'text-pink-600', bg: 'bg-pink-100/50', border: 'border-pink-200/50', hex: '#db2777' },
            { key: 'mutismo', label: 'Mutismo selettivo', icon: 'comment-slash', color: 'text-indigo-600', bg: 'bg-indigo-100/50', border: 'border-indigo-200/50', hex: '#4f46e5' },
            { key: 'banana', label: 'Banana', icon: 'lemon', color: 'text-lime-600', bg: 'bg-lime-100/50', border: 'border-lime-200/50', hex: '#65a30d' },
          ], []);

          // Reazioni ai ricordi (come eventi rapidi)
          const reactionConfig = useMemo(() => [
            { key: 'cuore', icon: 'heart', color: 'text-red-500' },
            { key: 'ridere', icon: 'face-laugh-beam', color: 'text-amber-500' },
            { key: 'wow', icon: 'face-surprise', color: 'text-blue-500' },
            { key: 'top', icon: 'fire', color: 'text-orange-500' },
            { key: 'applausi', icon: 'hands-clapping', color: 'text-emerald-600' },
          ], []);

          // --- CARICAMENTO DA SUPABASE ---
          const loadData = async () => {
            setLoading(true);
            setLoadError(false);
            try {
              const [memRes, evtRes] = await Promise.all([
                sb.from('memories').select('*').order('date'),
                sb.from('counter_events').select('*').order('timestamp')
              ]);
              if (memRes.error || evtRes.error) throw (memRes.error || evtRes.error);
              setMemories((memRes.data || []).map(m => ({ ...m, mediaUrl: m.media_url })));
              setCounterEvents(evtRes.data || []);
            } catch (e) {
              console.error('Errore caricamento dati:', e);
              setLoadError(true);
            } finally {
              setLoading(false);
            }
          };

          useEffect(() => { loadData(); }, []);

          // App-like: torna in cima quando cambi sezione
          useEffect(() => { window.scrollTo({ top: 0, behavior: 'instant' }); }, [activeTab]);

          // Posizione van all'avvio + stop del watch GPS allo smontaggio
          useEffect(() => { loadVanPos(); }, []);
          useEffect(() => () => { if (watchRef.current != null) navigator.geolocation.clearWatch(watchRef.current); }, []);

          // Reazioni: caricamento separato (tabella opzionale, fallback localStorage)
          const loadReactions = async () => {
            try { const ls = JSON.parse(localStorage.getItem('vd_reactions') || 'null'); if (ls) setReactions(ls); } catch (e) {}
            try {
              const { data, error } = await sb.from('reactions').select('*');
              if (!error && data) { setReactions(data); localStorage.setItem('vd_reactions', JSON.stringify(data)); }
            } catch (e) { /* tabella assente: resta su localStorage */ }
          };
          useEffect(() => { loadReactions(); }, []);

          const reactionCounts = useMemo(() => {
            const m = {};
            reactions.forEach(r => {
              if (!m[r.memory_id]) m[r.memory_id] = {};
              m[r.memory_id][r.key] = (m[r.memory_id][r.key] || 0) + 1;
            });
            return m;
          }, [reactions]);

          const addReaction = async (memoryId, key) => {
            const ev = { id: Date.now().toString() + Math.random().toString(36).slice(2, 6), memory_id: memoryId, key, timestamp: new Date().toISOString() };
            setReactions(prev => { const n = [...prev, ev]; try { localStorage.setItem('vd_reactions', JSON.stringify(n)); } catch (e) {} return n; });
            try { const { error } = await sb.from('reactions').insert(ev); if (error) console.warn('Reazione non salvata sul cloud:', error); }
            catch (e) { console.warn('Reazione errore:', e); }
          };

          // Geocoding di recupero: i ricordi salvati col solo nome (senza GPS)
          // ottengono coordinate dal nome luogo quando apri la mappa.
          useEffect(() => {
            if (activeTab !== 'map' || geoBackfillDone.current) return;
            const missing = memories.filter(m => m.location && (!m.lat || !m.lng));
            if (missing.length === 0) return;
            geoBackfillDone.current = true;
            (async () => {
              for (const m of missing) {
                const c = await geocodePlace(m.location);
                if (c) {
                  try { await sb.from('memories').update({ lat: c.lat, lng: c.lng }).eq('id', m.id); } catch (e) {}
                  setMemories(prev => prev.map(x => x.id === m.id ? { ...x, lat: c.lat, lng: c.lng } : x));
                }
                await new Promise(r => setTimeout(r, 1100)); // rispetta il rate limit di Nominatim
              }
            })();
          }, [activeTab, memories]);

          const counters = useMemo(() => {
            const counts = {};
            counterConfig.forEach(conf => { counts[conf.key] = 0; });
            counterEvents.forEach(ev => {
              if (counts[ev.key] !== undefined) counts[ev.key]++;
            });
            return counts;
          }, [counterEvents, counterConfig]);

          // Form State
          const [memoryType, setMemoryType] = useState('photo');
          const [title, setTitle] = useState('');
          const [location, setLocation] = useState('');
          const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
          const [text, setText] = useState('');
          const [mediaFile, setMediaFile] = useState(null);
          const [mediaPreview, setMediaPreview] = useState(null);
          const [memoryCoords, setMemoryCoords] = useState(null);
          const [isLocating, setIsLocating] = useState(false);
          const [recording, setRecording] = useState(false);
          const [recordSecs, setRecordSecs] = useState(0);
          const [uploadMsg, setUploadMsg] = useState('');
          const mediaRecorderRef = useRef(null);
          const audioChunksRef = useRef([]);
          const recordTimerRef = useRef(null);
          const fileInputRef = useRef(null);
          const mapRef = useRef(null);
          const mapInstanceRef = useRef(null);
          const vanMarkerRef = useRef(null);
          const watchRef = useRef(null);
          const lastSaveRef = useRef(0);
          const geocodeCache = useRef({});
          const geoBackfillDone = useRef(false);

          // GPS affidabile: HTTPS richiesto, race anti-blocco, fallback bassa precisione.
          const getPosition = () => new Promise((resolve, reject) => {
            if (!('geolocation' in navigator)) { reject({ code: 0 }); return; }
            // Geolocation funziona solo in contesto sicuro (HTTPS o localhost).
            if (typeof window !== 'undefined' && window.isSecureContext === false) {
              reject({ code: 4 }); return;
            }
            let done = false;
            const ok = (p) => { if (!done) { done = true; clearTimeout(hardTimer); resolve(p); } };
            const ko = (e) => { if (!done) { done = true; clearTimeout(hardTimer); reject(e); } };
            // Anti-blocco: se nessun callback arriva (bug iOS col prompt), rifiuta comunque.
            const hardTimer = setTimeout(() => ko({ code: 3 }), 22000);
            // 1° tentativo: alta precisione. Se fallisce/scade → fallback bassa precisione.
            navigator.geolocation.getCurrentPosition(
              ok,
              () => navigator.geolocation.getCurrentPosition(ok, ko, { enableHighAccuracy: false, timeout: 18000, maximumAge: 60000 }),
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
            );
          });

          const geoError = (e) => {
            if (!e) return 'Errore GPS';
            if (e.code === 1) return 'Permesso negato: abilita la posizione nelle impostazioni.';
            if (e.code === 2) return 'Posizione non disponibile in questo momento.';
            if (e.code === 3) return 'GPS lento: riprova all\'aperto.';
            if (e.code === 4) return 'GPS bloccato: apri l\'app via HTTPS.';
            return 'GPS non supportato su questo dispositivo.';
          };

          // Coordinate -> nome del luogo (OpenStreetMap reverse geocoding).
          const reverseGeocode = async (lat, lng) => {
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=14&addressdetails=1&accept-language=it&lat=${lat}&lon=${lng}`, { headers: { 'Accept': 'application/json' } });
              const data = await res.json();
              const a = data && data.address;
              if (!a) return null;
              const place = a.city || a.town || a.village || a.hamlet || a.municipality || a.suburb || a.county || a.state;
              const prov = a.county || a.state;
              if (!place) return data.display_name ? data.display_name.split(',').slice(0, 2).join(',').trim() : null;
              return prov && prov !== place ? `${place}, ${prov}` : place;
            } catch (e) { console.warn('Reverse geocoding fallito:', e); return null; }
          };

          const handleGetLocation = async () => {
            setIsLocating(true);
            setGeoMsg('');
            try {
              const pos = await getPosition();
              const lat = pos.coords.latitude, lng = pos.coords.longitude;
              setMemoryCoords({ lat, lng });
              // Riempi automaticamente il campo Luogo col nome del posto.
              const name = await reverseGeocode(lat, lng);
              if (name) setLocation(name);
              else setGeoMsg('Posizione presa, ma nome non trovato: scrivilo tu.');
            } catch (e) {
              setGeoMsg(geoError(e));
            } finally {
              setIsLocating(false);
            }
          };

          // ===== POSIZIONE VAN (condivisa via Supabase, fallback localStorage) =====
          const loadVanPos = async () => {
            try {
              const ls = JSON.parse(localStorage.getItem('vd_van') || 'null');
              if (ls) setVanPos(ls);
            } catch (e) {}
            try {
              const { data, error } = await sb.from('van_position').select('*').eq('id', 'van').maybeSingle();
              if (!error && data) {
                const v = { lat: data.lat, lng: data.lng, updated_at: data.updated_at };
                setVanPos(v);
                localStorage.setItem('vd_van', JSON.stringify(v));
              }
            } catch (e) { /* tabella assente: resta su localStorage */ }
          };

          const saveVanPos = async (lat, lng) => {
            const v = { lat, lng, updated_at: new Date().toISOString() };
            setVanPos(v);
            try { localStorage.setItem('vd_van', JSON.stringify(v)); } catch (e) {}
            try { await sb.from('van_position').upsert({ id: 'van', lat, lng, updated_at: v.updated_at }); }
            catch (e) { console.warn('Van non salvato sul cloud:', e); }
          };

          const handleVanHere = async () => {
            setVanBusy(true);
            setGeoMsg('');
            try {
              const pos = await getPosition();
              const lat = pos.coords.latitude, lng = pos.coords.longitude;
              await saveVanPos(lat, lng);
              if (mapInstanceRef.current) mapInstanceRef.current.setView([lat, lng], 14, { animate: true });
              setGeoMsg('Van aggiornato');
            } catch (e) {
              setGeoMsg(geoError(e));
            } finally {
              setVanBusy(false);
            }
          };

          const toggleFollow = () => {
            if (vanFollow) {
              if (watchRef.current != null) navigator.geolocation.clearWatch(watchRef.current);
              watchRef.current = null;
              setVanFollow(false);
              return;
            }
            if (!('geolocation' in navigator)) { setGeoMsg(geoError({ code: 0 })); return; }
            setVanFollow(true);
            setGeoMsg('Ti sto seguendo…');
            watchRef.current = navigator.geolocation.watchPosition(
              (pos) => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                setVanPos({ lat, lng, updated_at: new Date().toISOString() });
                if (mapInstanceRef.current) mapInstanceRef.current.panTo([lat, lng], { animate: true });
                const now = Date.now();
                if (now - lastSaveRef.current > 15000) { lastSaveRef.current = now; saveVanPos(lat, lng); }
              },
              (e) => { setGeoMsg(geoError(e)); setVanFollow(false); if (watchRef.current != null) { navigator.geolocation.clearWatch(watchRef.current); watchRef.current = null; } },
              { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 }
            );
          };

          const makeVanIcon = () => window.L.divIcon({
            className: 'van-marker',
            html: '<span class="van-pulse"></span><div class="van-dot"><i class="fa-solid fa-van-shuttle"></i></div>',
            iconSize: [46, 46], iconAnchor: [23, 23]
          });

          const vanAgo = (iso) => {
            if (!iso) return '';
            const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
            if (isNaN(diff)) return '';
            if (diff < 1) return 'ora';
            if (diff < 60) return `${diff} min fa`;
            const h = Math.floor(diff / 60);
            if (h < 24) return `${h}h fa`;
            return `${Math.floor(h / 24)}g fa`;
          };

          // Converte un nome di luogo in coordinate (OpenStreetMap Nominatim), con cache.
          const geocodePlace = async (name) => {
            if (!name) return null;
            const key = name.toLowerCase().trim();
            if (geocodeCache.current[key]) return geocodeCache.current[key];
            try {
              const ls = JSON.parse(localStorage.getItem('vd_geocache') || '{}');
              if (ls[key]) { geocodeCache.current[key] = ls[key]; return ls[key]; }
            } catch (e) {}
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=it&q=${encodeURIComponent(name)}`, { headers: { 'Accept': 'application/json' } });
              const arr = await res.json();
              if (arr && arr[0]) {
                const coords = { lat: parseFloat(arr[0].lat), lng: parseFloat(arr[0].lon) };
                geocodeCache.current[key] = coords;
                try { const ls = JSON.parse(localStorage.getItem('vd_geocache') || '{}'); ls[key] = coords; localStorage.setItem('vd_geocache', JSON.stringify(ls)); } catch (e) {}
                return coords;
              }
            } catch (e) { console.warn('Geocoding fallito:', e); }
            return null;
          };

          // Registrazione audio in-app (MediaRecorder).
          const audioExt = (mime) => mime.includes('mp4') ? 'm4a' : mime.includes('ogg') ? 'ogg' : mime.includes('mpeg') ? 'mp3' : 'weba';

          const startRecording = async () => {
            if (!navigator.mediaDevices || !window.MediaRecorder) { alert('Registrazione non supportata su questo browser.'); return; }
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              const mr = new MediaRecorder(stream);
              audioChunksRef.current = [];
              mr.ondataavailable = (e) => { if (e.data && e.data.size) audioChunksRef.current.push(e.data); };
              mr.onstop = () => {
                const blob = new Blob(audioChunksRef.current, { type: mr.mimeType || 'audio/webm' });
                const file = new File([blob], `registrazione-${Date.now()}.${audioExt(blob.type)}`, { type: blob.type });
                if (mediaPreview) URL.revokeObjectURL(mediaPreview);
                setMediaFile(file);
                setMediaPreview(URL.createObjectURL(blob));
                stream.getTracks().forEach((t) => t.stop());
              };
              mr.start();
              mediaRecorderRef.current = mr;
              setRecording(true);
              setRecordSecs(0);
              clearInterval(recordTimerRef.current);
              recordTimerRef.current = setInterval(() => setRecordSecs((s) => s + 1), 1000);
            } catch (e) {
              alert('Microfono non disponibile o permesso negato.');
            }
          };

          const stopRecording = () => {
            if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') mediaRecorderRef.current.stop();
            clearInterval(recordTimerRef.current);
            setRecording(false);
          };

          // Stop registrazione allo smontaggio
          useEffect(() => () => { clearInterval(recordTimerRef.current); if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') mediaRecorderRef.current.stop(); }, []);

          const fmtSecs = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

          const handleFileChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              setMediaFile(file);
              const url = URL.createObjectURL(file);
              setMediaPreview(url);
            }
          };

          // Ridimensiona/comprime le foto prima dell'upload: più leggere, upload
          // affidabile, e ri-encoding in JPEG (risolve HEIC iPhone non visibili).
          const compressImage = (file) => new Promise((resolve) => {
            if (!file.type || !file.type.startsWith('image/')) { resolve(file); return; }
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
              URL.revokeObjectURL(url);
              const max = 1920;
              let w = img.width, h = img.height;
              if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              canvas.toBlob((blob) => {
                if (!blob) { resolve(file); return; }
                resolve(new File([blob], `foto-${Date.now()}.jpg`, { type: 'image/jpeg' }));
              }, 'image/jpeg', 0.85);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
            img.src = url;
          });

          // Upload con tentativi multipli (rete mobile instabile).
          const uploadWithRetry = async (file, attempts = 3) => {
            const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
            for (let i = 0; i < attempts; i++) {
              const path = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
              try {
                const { data, error } = await sb.storage.from('media').upload(path, file, { contentType: file.type, upsert: false });
                if (!error && data) {
                  const { data: urlData } = sb.storage.from('media').getPublicUrl(data.path);
                  return urlData.publicUrl;
                }
                console.warn('Upload tentativo', i + 1, 'fallito:', error);
              } catch (e) { console.warn('Upload errore:', e); }
              await new Promise((r) => setTimeout(r, 800 * (i + 1)));
            }
            return null;
          };

          const handleAddMemory = async (e) => {
            e.preventDefault();
            if (!title || !location || !date) return;
            setSaving(true);
            setUploadMsg('');

            let mediaUrl = null;

            if (mediaFile) {
              let toUpload = mediaFile;
              if (mediaFile.type && mediaFile.type.startsWith('image/')) {
                try { toUpload = await compressImage(mediaFile); } catch (e) {}
              }
              mediaUrl = await uploadWithRetry(toUpload);
              if (!mediaUrl) {
                // Non salvare un ricordo senza il suo media: meglio far riprovare.
                setSaving(false);
                setUploadMsg('Caricamento del media fallito (connessione?). Il ricordo NON è stato salvato: riprova.');
                return;
              }
            }

            // Coordinate: prima il GPS; se assente, geocoda il nome del luogo.
            let coords = memoryCoords;
            if (!coords) coords = await geocodePlace(location);

            // Tipo reale dal MIME del file (evita video salvati come "audio").
            let finalType = memoryType;
            if (mediaFile && mediaFile.type) {
              if (mediaFile.type.startsWith('video/')) finalType = 'video';
              else if (mediaFile.type.startsWith('audio/')) finalType = 'audio';
              else if (mediaFile.type.startsWith('image/')) finalType = 'photo';
            }

            const newMemory = {
              id: Date.now().toString(),
              type: finalType,
              title, location, date, text,
              media_url: mediaUrl,
              lat: coords?.lat || null,
              lng: coords?.lng || null
            };

            const { data, error } = await sb.from('memories').insert(newMemory).select().single();
            if (!error && data) {
              const memForState = { ...data, mediaUrl: data.media_url };
              setMemories(prev => [...prev, memForState].sort((a, b) => new Date(a.date) - new Date(b.date)));
            }

            setSaving(false);
            setTitle(''); setLocation(''); setText('');
            setMediaFile(null); setMediaPreview(null); setMemoryCoords(null);
            setActiveTab('timeline');
          };

          const deleteMemory = async (id) => {
            if (!confirm('Eliminare questo ricordo?')) return;
            await sb.from('memories').delete().eq('id', id);
            setMemories(memories.filter(m => m.id !== id));
          };

          const handleExportJSON = () => {
            const dataStr = JSON.stringify(memories, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'diario-viaggio-catania-potenza.json');
            linkElement.click();
          };

          const formatDate = (d, long = false) => {
            if (!d) return '';
            const dt = new Date(d);
            if (isNaN(dt.getTime())) return d;
            return dt.toLocaleDateString('it-IT', long
              ? { day: 'numeric', month: 'long', year: 'numeric' }
              : { day: '2-digit', month: 'short' });
          };

          // Determina il tipo di player dall'estensione reale del file (non dal tipo salvato).
          const mediaKind = (url, fallback) => {
            const ext = (url || '').split('?')[0].split('.').pop().toLowerCase();
            if (['mp4', 'webm', 'mov', 'm4v', 'mkv', 'avi', '3gp', 'quicktime'].includes(ext)) return 'video';
            if (['mp3', 'm4a', 'wav', 'aac', 'oga', 'ogg', 'opus', 'flac'].includes(ext)) return 'audio';
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'heif', 'avif', 'bmp'].includes(ext)) return 'photo';
            return fallback || 'photo';
          };

          // Render media robusto: sceglie l'elemento giusto + link "apri originale" di fallback.
          const renderMedia = (url, fallbackType, { imgClass = '', videoClass = '', dark = false } = {}) => {
            if (!url) return null;
            const kind = mediaKind(url, fallbackType);
            const linkColor = dark ? 'text-stone-400 hover:text-white' : 'text-stone-400 hover:text-emerald-600';
            const fallbackLink = (
              <a href={url} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()}
                 className={`flex items-center justify-center gap-2 py-2 text-[11px] font-black uppercase tracking-widest transition-colors ${linkColor}`}>
                <i className="fa-solid fa-arrow-up-right-from-square"></i> Apri originale
              </a>
            );
            if (kind === 'photo') {
              return <img src={url} loading="lazy" alt="" className={imgClass} />;
            }
            if (kind === 'video') {
              return (
                <>
                  <video src={url} controls playsInline preload="metadata" className={videoClass}></video>
                  {fallbackLink}
                </>
              );
            }
            return (
              <div className={dark ? 'bg-white/5 p-4' : 'p-4'}>
                <audio src={url} controls preload="metadata" className="w-full"></audio>
                {fallbackLink}
              </div>
            );
          };

          // Header di sezione a forma di cartello stradale (freccia direzionale).
          const sectionHeader = (icon, title, subtitle, hex = '#3D5AFE', dark = false) => (
            <div className="mb-6">
              <div className={`sign-arrow inline-flex items-center gap-2.5 pl-4 pr-9 py-2.5 shadow-lg ${dark ? 'text-stone-900' : 'text-white'}`} style={{ backgroundColor: hex }}>
                <i className={`fa-solid fa-${icon} text-lg`}></i>
                <h2 className="text-xl md:text-2xl font-black tracking-tight uppercase leading-none">{title}</h2>
              </div>
              {subtitle && <p className="text-stone-500 font-bold text-sm mt-2.5 ml-1">{subtitle}</p>}
            </div>
          );

          const getTypeIcon = (type, className = "text-xl") => {
            switch (type) {
              case 'photo': return <i className={`fa-solid fa-image ${className}`}></i>;
              case 'video': return <i className={`fa-solid fa-video ${className}`}></i>;
              case 'audio': return <i className={`fa-solid fa-microphone ${className}`}></i>;
              case 'text': return <i className={`fa-solid fa-font ${className}`}></i>;
              default: return <i className={`fa-solid fa-compass ${className}`}></i>;
            }
          };

          const handleCounterChange = async (key, delta) => {
            if (delta > 0) {
              const newId = Date.now().toString();
              const now = new Date().toISOString();

              // Aggiorna UI subito (ottimistico)
              setCounterEvents(prev => [...prev, { id: newId, key, lat: null, lng: null, timestamp: now }]);

              // Prova a prendere GPS (max 5s, accetta fix recenti fino a 30s)
              let lat = null, lng = null;
              if ('geolocation' in navigator) {
                try {
                  const pos = await new Promise((resolve, reject) =>
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000, maximumAge: 30000 })
                  );
                  lat = pos.coords.latitude;
                  lng = pos.coords.longitude;
                  setCounterEvents(prev => prev.map(ev => ev.id === newId ? { ...ev, lat, lng } : ev));
                } catch (e) {}
              }

              const { error } = await sb.from('counter_events').insert({ id: newId, key, lat, lng, timestamp: now });
              if (error) {
                console.error('Errore salvataggio counter:', error);
                setCounterEvents(prev => prev.filter(ev => ev.id !== newId));
              }
            } else {
              const copy = [...counterEvents];
              for (let i = copy.length - 1; i >= 0; i--) {
                if (copy[i].key === key) {
                  const { error } = await sb.from('counter_events').delete().eq('id', copy[i].id);
                  if (error) { console.error('Errore eliminazione counter:', error); return; }
                  copy.splice(i, 1);
                  break;
                }
              }
              setCounterEvents(copy);
            }
          };

          // --- STATISTICHE ---
          const stats = useMemo(() => {
            const total = memories.length;
            const locations = new Set(memories.map(m => m.location.toLowerCase().trim())).size;

            const types = { photo: 0, video: 0, audio: 0, text: 0 };
            memories.forEach(m => { if(types[m.type] !== undefined) types[m.type]++; });

            const typePercentages = {
              photo: total ? (types.photo / total) * 100 : 0,
              video: total ? (types.video / total) * 100 : 0,
              audio: total ? (types.audio / total) * 100 : 0,
              text: total ? (types.text / total) * 100 : 0,
            };

            const dates = {};
            memories.forEach(m => { dates[m.date] = (dates[m.date] || 0) + 1; });
            const sortedDates = Object.keys(dates).sort();
            const dateActivity = sortedDates.map(d => ({
              key: d,
              date: new Date(d).toLocaleDateString('it-IT', { day: '2-digit', month: 'short' }),
              count: dates[d]
            }));
            const maxActivity = Math.max(...dateActivity.map(d => d.count), 1);

            // Periodo / giorni di viaggio
            const firstDate = sortedDates[0] || null;
            const lastDate = sortedDates[sortedDates.length - 1] || null;
            const tripDays = (firstDate && lastDate)
              ? Math.round((new Date(lastDate) - new Date(firstDate)) / 86400000) + 1
              : 0;

            // Giorno più attivo
            const busiest = dateActivity.reduce((a, b) => (b.count > (a ? a.count : 0) ? b : a), null);

            // Copertura GPS

                    </div>

                    <div className={cardCls}>
                      <div className="absolute -top-16 left-1/2 -translate-x-1/2 w-64 h-64 rounded-full blur-3xl opacity-20 pointer-events-none" style={{ backgroundColor: riskPhase === 'go' ? '#dc2626' : '#F97D16' }}></div>
                      {riskPhase === 'idle' && (
                        <>
                          <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest mb-6 relative z-10" style={{ backgroundColor: '#F97D1622', color: '#F97D16' }}>
                            <i className="fa-solid fa-dice-five"></i> Quanto te la rischi
                          </span>
                          <p className="text-xl md:text-2xl font-black text-stone-800 tracking-tight leading-snug relative z-10">
                            Pensate un numero da <span className="text-[#F97D16]">1 a {riskMax}</span>.<br/>Al VIA ditelo insieme: se è uguale, penitenza!
                          </p>
                        </>
                      )}
                      {(riskPhase === '3' || riskPhase === '2' || riskPhase === '1') && (
                        <p key={riskPhase} className="text-8xl font-black text-stone-900 tabular-nums relative z-10 animate-[pulse_0.4s_ease-out]">{riskPhase}</p>
                      )}
                      {riskPhase === 'go' && (
                        <p className="text-5xl md:text-6xl font-black text-red-600 tracking-tighter relative z-10 animate-pulse">DITE IL NUMERO!</p>
                      )}
                    </div>

                    <button onClick={startRisk} disabled={riskPhase !== 'idle'} className="w-full h-16 bg-stone-900 hover:bg-stone-800 disabled:opacity-60 text-white rounded-3xl font-black text-lg transition-all shadow-xl shadow-stone-300/40 flex items-center justify-center gap-3 active:scale-95">
                      <i className="fa-solid fa-bolt"></i> {riskPhase === 'idle' ? 'VIA!' : '…'}
                    </button>
                  </>
                )}

                {/* ===== SFIDE ===== */}
                {gameMode === 'challenge' && (
                  <>
                    <div className={cardCls}>
                      <div className="absolute -top-16 left-1/2 -translate-x-1/2 w-64 h-64 rounded-full blur-3xl opacity-20 pointer-events-none" style={{ backgroundColor: '#F97D16' }}></div>
                      <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest mb-6 relative z-10" style={{ backgroundColor: '#F97D1622', color: '#F97D16' }}>
                        <i className="fa-solid fa-fire-flame-curved"></i> Sfida di gruppo
                      </span>
                      <p className="text-2xl md:text-3xl font-black text-stone-900 tracking-tight leading-snug relative z-10">{chCard || '…'}</p>
                    </div>
                    <button onClick={nextChallenge} className="w-full h-16 bg-stone-900 hover:bg-stone-800 text-white rounded-3xl font-black text-lg transition-all shadow-xl shadow-stone-300/40 flex items-center justify-center gap-3 active:scale-95">
                      <i className="fa-solid fa-shuffle"></i> Altra sfida
                    </button>
                  </>
                )}
              </div>
            );
          };

          const renderOutputView = () => {
            const totalEvents = counterEvents.length;
            return (
            <div id="album-print" className="min-h-screen bg-[#2B2A28] text-stone-100 px-6 py-8 sm:p-10 md:p-12 mx-4 md:mx-0 rounded-3xl md:rounded-3xl shadow-3xl relative overflow-hidden">
              {/* Decorative elements */}
              <div className="absolute top-0 left-0 w-full h-full opacity-20 pointer-events-none">
                 <div className="absolute top-1/4 right-0 w-96 h-96 bg-emerald-600/30 blur-[150px] rounded-full"></div>
                 <div className="absolute bottom-1/4 left-0 w-96 h-96 bg-orange-500/20 blur-[150px] rounded-full"></div>
              </div>

              <div className="max-w-4xl mx-auto relative z-10">
                {/* COVER */}
                <header className="text-center mb-16 pt-10 md:pt-16">
                  <span className="inline-block px-4 py-1.5 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-emerald-400 text-[10px] font-black uppercase tracking-[0.2em] mb-6">Diario di viaggio</span>
                  <h1 className="text-5xl md:text-7xl font-black text-white mb-6 tracking-tighter leading-[0.9]">Album di<br/>Bordo</h1>
                  <div className="flex items-center justify-center gap-3 text-stone-300 text-sm font-bold mb-10">
                    <span className="bg-white/5 px-4 py-2 rounded-2xl border border-white/10">Catania</span>
                    <i className="fa-solid fa-arrow-right-long text-emerald-500/60"></i>
                    <span className="bg-white/5 px-4 py-2 rounded-2xl border border-white/10">Potenza</span>
                  </div>
                  {/* Meta cover */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-2xl mx-auto">
                    {[
                      { v: stats.total, l: 'Tappe' },
                      { v: stats.locations, l: 'Città' },
                      { v: stats.tripDays, l: 'Giorni' },
                      { v: totalEvents, l: 'Eventi' },
                    ].map(m => (
                      <div key={m.l} className="bg-white/5 border border-white/10 rounded-2xl py-4">
                        <div className="text-3xl font-black text-white tabular-nums">{m.v}</div>
                        <div className="text-[10px] font-black uppercase tracking-widest text-stone-400 mt-0.5">{m.l}</div>
                      </div>
                    ))}
                  </div>
                  {stats.firstDate && (
                    <p className="text-stone-500 font-bold text-xs uppercase tracking-widest mt-6">{formatDate(stats.firstDate, true)} — {formatDate(stats.lastDate, true)}</p>
                  )}
                </header>

                {/* INDICE */}
                {memories.length > 1 && (
                  <div className="mb-16 border-t border-white/10 pt-8">
                    <h3 className="text-[11px] font-black uppercase tracking-[0.2em] text-stone-500 mb-5">Indice</h3>
                    <div className="space-y-1">
                      {memories.map((m, i) => (
                        <div key={m.id} className="flex items-baseline gap-4 py-2 border-b border-white/5">
                          <span className="text-stone-600 font-black text-sm tabular-nums w-7">{String(i + 1).padStart(2, '0')}</span>
                          <span className="text-white font-bold flex-1 truncate">{m.title}</span>
                          <span className="text-stone-500 font-bold text-xs whitespace-nowrap">{formatDate(m.date)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* CAPITOLI */}
                <div className="space-y-24 md:space-y-36 pb-16">
                  {memories.length === 0 && <p className="text-center text-stone-500 text-lg">Nessun capitolo ancora scritto.</p>}
                  {memories.map((memory, idx) => (
                    <article key={memory.id} className="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-16 items-center">
                      <div className={`md:col-span-7 ${idx % 2 === 0 ? 'md:order-1' : 'md:order-2'}`}>
                        {memory.mediaUrl ? (
                          <div className="rounded-3xl overflow-hidden shadow-[0_30px_60px_-15px_rgba(0,0,0,0.5)] border border-white/10 group">
                            {(() => {
                              const k = mediaKind(memory.mediaUrl, memory.type);
                              if (k === 'photo') return <img src={memory.mediaUrl} loading="lazy" className="w-full h-[50dvh] md:h-[70dvh] object-cover transition-transform duration-1000 group-hover:scale-110" alt="Ricordo" />;
                              if (k === 'video') return renderMedia(memory.mediaUrl, 'video', { videoClass: 'w-full h-[50dvh] md:h-[70dvh] object-contain bg-black', dark: true });
                              return (
                                <div className="bg-white/5 py-8 px-6 flex flex-col items-center">
                                  <i className="fa-solid fa-microphone text-5xl text-emerald-500 mb-6"></i>
                                  {renderMedia(memory.mediaUrl, 'audio', { dark: true })}
                                </div>
                              );
                            })()}
                          </div>
                        ) : (
                          <div className="bg-white/5 border border-white/5 rounded-3xl h-48 md:h-64 flex items-center justify-center">
                             <i className="fa-solid fa-quote-left text-5xl text-stone-700"></i>
                          </div>
                        )}
                      </div>
                      <div className={`md:col-span-5 ${idx % 2 === 0 ? 'md:order-2' : 'md:order-1'}`}>
                        <div className="flex items-center gap-3 mb-5">
                          <span className="text-5xl md:text-6xl font-black text-white/10 tracking-tighter tabular-nums leading-none">{String(idx + 1).padStart(2, '0')}</span>
                          <span className="inline-flex items-center gap-1.5 px-3 py-1 bg-white/5 border border-white/10 text-stone-300 rounded-2xl text-[10px] font-black uppercase tracking-widest">
                            {getTypeIcon(memory.type, 'text-[10px]')} {formatDate(memory.date, true)}
                          </span>
                        </div>
                        <h2 className="text-3xl md:text-4xl font-black mb-4 text-white tracking-tighter leading-none">{memory.title}</h2>
                        <div className="flex items-center gap-2 text-emerald-400 mb-6 font-bold text-sm">
                          <i className="fa-solid fa-location-dot"></i> {memory.location}
                          {memory.lat && memory.lng && <i className="fa-solid fa-map-pin text-stone-600 text-xs" title="Geolocalizzato"></i>}
                        </div>
                        {memory.text && (
                          <p className="text-stone-300 text-lg leading-relaxed font-medium border-l-2 border-emerald-500/40 pl-4">{memory.text}</p>
                        )}
                      </div>
                    </article>
                  ))}
                </div>

                {/* RECAP + FOOTER */}
                {memories.length > 0 && (
                   <footer className="pt-16 border-t border-white/10 pb-16">
                      <h3 className="text-[11px] font-black uppercase tracking-[0.2em] text-stone-500 mb-6 text-center">Il viaggio in numeri</h3>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-12 max-w-3xl mx-auto">
                        {[
                          { v: stats.total, l: 'Ricordi', i: 'images' },
                          { v: stats.locations, l: 'Città', i: 'location-dot' },
                          { v: totalEvents, l: 'Eventi', i: 'hashtag' },
                          { v: stats.gpsPct + '%', l: 'Su mappa', i: 'map-location-dot' },
                        ].map(s => (
                          <div key={s.l} className="bg-white/5 border border-white/10 rounded-2xl p-5 text-center">
                            <i className={`fa-solid fa-${s.i} text-emerald-400 mb-2`}></i>
                            <div className="text-2xl font-black text-white tabular-nums">{s.v}</div>
                            <div className="text-[10px] font-black uppercase tracking-widest text-stone-400 mt-0.5">{s.l}</div>
                          </div>
                        ))}
                      </div>
                      <div className="flex flex-col sm:flex-row items-center justify-center gap-4 print:hidden">
                        <button onClick={() => window.print()} className="w-full sm:w-auto h-16 px-10 bg-emerald-600 hover:bg-emerald-500 text-white rounded-3xl font-black text-lg transition-all shadow-xl shadow-emerald-900/40 flex items-center justify-center gap-3 active:scale-95">
                          <i className="fa-solid fa-file-pdf"></i> Salva PDF
                        </button>
                        <button onClick={handleExportJSON} className="w-full sm:w-auto h-16 px-10 bg-white/5 hover:bg-white/10 text-white rounded-3xl font-black text-lg transition-all border border-white/10 flex items-center justify-center gap-3 active:scale-95">
                          <i className="fa-solid fa-code"></i> JSON Data
                        </button>
                      </div>
                   </footer>
                )}
              </div>
            </div>
            );
          };

          return (
            <div className="min-h-screen pb-[calc(9rem+env(safe-area-inset-bottom))] md:pb-8">

              {/* Header Desktop */}
              <nav className="hidden md:block sticky top-0 z-50 bg-white/70 backdrop-blur-xl border-b border-white/20 px-8 py-4">
                <div className="max-w-6xl mx-auto flex justify-between items-center">
                  <div className="flex items-center gap-4">
                    <img src="./roadiario-mark.svg" alt="il roadiario" className="h-14 w-auto" />
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="flex bg-stone-200/50 backdrop-blur p-1.5 rounded-2xl border border-white/50">
                      {[
                        { id: 'timeline', icon: 'list', label: 'Diario' },
                        { id: 'map', icon: 'route', label: 'Mappa' },
                        { id: 'counters', icon: 'hashtag', label: 'Eventi' },
                        { id: 'game', icon: 'dice', label: 'Gioco' },
                        { id: 'stats', icon: 'chart-simple', label: 'Data' },
                        { id: 'output', icon: 'images', label: 'Album' }
                      ].map(tab => (
                        <button
                          key={tab.id}
                          onClick={() => setActiveTab(tab.id)}
                          className={`flex items-center gap-2 px-5 py-2.5 rounded-2xl text-xs font-black uppercase tracking-widest transition-all ${activeTab === tab.id ? 'bg-white text-emerald-700 shadow-sm border-stone-100 border' : 'text-stone-400 hover:text-stone-800'}`}
                        >
                          <i className={`fa-solid fa-${tab.icon}`}></i> {tab.label}
                        </button>
                      ))}
                    </div>
                    <button
                      onClick={() => setActiveTab('add')}
                      className={`flex items-center gap-2 px-5 py-2.5 rounded-2xl text-xs font-black uppercase tracking-widest transition-all shadow-lg ${activeTab === 'add' ? 'bg-stone-900 text-white' : 'bg-[#edff00] text-stone-900 hover:brightness-95'}`}
                    >
                      <i className="fa-solid fa-plus"></i> Nuova
                    </button>
                    <button
                      onClick={() => { localStorage.removeItem(AUTH_KEY); setAuthed(false); }}
                      title="Esci"
                      className="w-11 h-11 rounded-2xl bg-stone-100/80 border border-white text-stone-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition-all"
                    >
                      <i className="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                  </div>
                </div>
              </nav>

              {/* Floating Action Button Mobile */}
              <button
                onClick={() => setActiveTab(activeTab === 'add' ? 'timeline' : 'add')}
                style={{ bottom: 'calc(7rem + env(safe-area-inset-bottom))' }}
                className={`md:hidden fixed right-5 z-[60] w-16 h-16 rounded-3xl shadow-[0_15px_30px_-5px_rgba(0,0,0,0.25)] flex items-center justify-center transition-all active:scale-90 ${activeTab === 'add' ? 'bg-stone-900 rotate-45 text-white' : 'bg-[#edff00] text-stone-900'}`}
              >
                <i className="fa-solid fa-plus text-2xl"></i>
              </button>

              {/* Mobile Navbar: Floating Pill */}
              <nav
                style={{ bottom: 'calc(1rem + env(safe-area-inset-bottom))' }}
                className="md:hidden fixed left-1/2 -translate-x-1/2 z-50 w-[94%] max-w-md h-20 bg-white/80 backdrop-blur-2xl rounded-full border border-white/60 shadow-2xl shadow-stone-300/40 px-3 flex items-center justify-around">
                  {[
                    { id: 'timeline', icon: 'list-ul', label: 'Diario' },
                    { id: 'map', icon: 'map-location-dot', label: 'Mappa' },
                    { id: 'counters', icon: 'hashtag', label: 'Eventi' },
                    { id: 'game', icon: 'dice', label: 'Gioco' },
                    { id: 'stats', icon: 'chart-line', label: 'Data' },
                    { id: 'output', icon: 'images', label: 'Album' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === tab.id ? 'text-emerald-600 scale-110' : 'text-stone-400'}`}
                    >
                      <i className={`fa-solid fa-${tab.icon} text-xl`}></i>
                      <span className={`text-[8px] font-black uppercase tracking-widest mt-1 transition-opacity ${activeTab === tab.id ? 'opacity-100' : 'opacity-0 h-0 overflow-hidden'}`}>{tab.label}</span>
                    </button>
                  ))}
              </nav>

              {/* Mobile Top Header */}
              <div className="md:hidden safe-top pt-5 pb-4 px-5 flex items-center justify-between bg-transparent">
                  <div className="flex items-center gap-3">
                    <img src="./roadiario-mark.svg" alt="il roadiario" className="h-12 w-auto" />
                  </div>
                  <button
                    onClick={() => { localStorage.removeItem(AUTH_KEY); setAuthed(false); }}
                    title="Esci"
                    className="w-11 h-11 rounded-2xl bg-stone-100/80 backdrop-blur border border-white flex items-center justify-center text-stone-400 active:scale-90 transition-all"
                  >
                    <i className="fa-solid fa-arrow-right-from-bracket"></i>
                  </button>
              </div>

              <main className="max-w-6xl mx-auto md:p-8">
                {activeTab === 'add' && renderAddView()}
                {activeTab === 'map' && renderMapView()}
                {activeTab === 'counters' && renderCountersView()}
                {activeTab === 'game' && renderGameView()}
                {activeTab === 'timeline' && renderTimelineView()}
                {activeTab === 'stats' && renderStatsView()}
                {activeTab === 'output' && renderOutputView()}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VanDiaryApp />);
    </script>

    <!-- Service Worker (offline / installabile / auto-update) -->
    <script>
      if ('serviceWorker' in navigator) {
        let reloading = false;
        // Quando un nuovo SW prende il controllo (nuova versione cache) ricarica una volta.
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            // Controlla aggiornamenti all'avvio e quando la tab torna in primo piano.
            reg.update();
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update();
            });
          }).catch((e) => console.warn('SW non registrato:', e));
        });
      }
    </script>
</body>
</html>
