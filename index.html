<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- PWA -->

    <!-- Tailwind CSS -->

      // Palette The Wave Studio + font Inter.
      // Rimappo le scale 'emerald' (accento) e 'stone' (neutri) cosi' tutte

              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif']

            colors: {
              // Accento primario -> blu Wave #0057FF
              emerald: {
                50: '#EAF1FF', 100: '#D6E4FF', 200: '#ADC8FF', 300: '#7AA5FF',
                400: '#3D7BFF', 500: '#1A66FF', 600: '#0057FF', 700: '#0046CC',
                800: '#00379E', 900: '#002A78'
              },
              // Neutri caldi -> cream / sand / ink Wave
              stone: {
                50: '#FAF7EB', 100: '#F1ECDD', 200: '#CDC3BA', 300: '#B9AEA3',
                400: '#9C9187', 500: '#6F665E', 600: '#514A44', 700: '#3C3733',
                800: '#323232', 900: '#262524'
              },
              wave: {
                blue: '#0057FF', yellow: '#FFD400', orange: '#F97D16',
                sand: '#CDC3BA', cream: '#FAF7EB', ink: '#323232'
              }
            }
          }
        }
      };
    </script>

    <!-- FontAwesome (per le icone) -->

    <!-- Supabase -->

    <!-- Banco domande per la sezione Gioco -->
    <script src="./questions.js"></script>

    <!-- Babel (per compilare React nel browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Utility styles */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }

        /* Assicura che la mappa prenda gli eventi correttamente */

        /* Custom Scrollbar for Desktop */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);

        @keyframes float {

            50% { transform: translateY(-5px); }

            #album-print h1, #album-print h2 { color: #0c0a09 !important; }
            #album-print p, #album-print span { color: #44403c !important; }

<body class="bg-[#FAF7EB] text-stone-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useMemo, useEffect } = React;

        // ========== SUPABASE CONFIG ==========
        // 1. Vai su https://supabase.com e crea un progetto gratuito
        // 2. Settings → API → copia Project URL e anon public key
        const SUPABASE_URL = 'https://buxyihdvmdaltvwzdmez.supabase.co';  // <-- sostituisci
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1eHlpaGR2bWRhbHR2d3pkbWV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTQyMDUsImV4cCI6MjA5NjA3MDIwNX0.JifKRtrM1ZJowQ7Qebi-60eY9jG4XLer7FnvWp-wHj8';            // <-- sostituisci
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // =====================================

        const AUTH_KEY = 'vd_auth';
        const PASSWORD = '080219';

        function LoginScreen({ onSuccess }) {
          const [pwd, setPwd] = useState('');
          const [error, setError] = useState(false);

          useEffect(() => {
            if (pwd.length === 6) {
              if (pwd === PASSWORD) {
                localStorage.setItem(AUTH_KEY, '1');
                onSuccess();
              } else {
                setError(true);
                setTimeout(() => {
                  setPwd('');
                  setError(false);
                }, 600);
              }
            }
          }, [pwd, onSuccess]);

          const handleAddDigit = (digit) => {
            if (pwd.length < 6) {
              setPwd(prev => prev + digit);
              setError(false);
            }
          };

          const handleDelete = () => {
            setPwd(prev => prev.slice(0, -1));
            setError(false);
          };

          // Supporto tastiera fisica (desktop)
          useEffect(() => {
            const onKey = (e) => {
              if (e.key >= '0' && e.key <= '9') handleAddDigit(e.key);
              else if (e.key === 'Backspace') handleDelete();
            };
            window.addEventListener('keydown', onKey);
            return () => window.removeEventListener('keydown', onKey);
          }, [pwd]);

          return (
            <div className="min-h-screen bg-[#323232] flex flex-col items-center justify-center p-6 select-none relative overflow-hidden">
              {/* Background Glow */}
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-emerald-600/10 blur-[120px] rounded-full pointer-events-none"></div>
              
              {/* Header */}
              <div className="text-center mb-10 relative z-10">
                <div className="bg-emerald-600 w-16 h-16 rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-2xl shadow-emerald-600/20 animate-float">
                  <i className="fa-solid fa-location-arrow text-3xl text-white"></i>
                </div>
                <h1 className="text-4xl font-black text-white tracking-tighter mb-2">VanDiary</h1>
                <p className="text-stone-500 font-medium">Benvenuto. Digita il tuo codice.</p>
              </div>

              {/* Dots */}
              <div className={`flex gap-5 mb-16 relative z-10 transition-transform ${error ? 'animate-shake' : ''}`}>
                {[...Array(6)].map((_, i) => (
                  <div
                    key={i}
                    className={`w-3.5 h-3.5 rounded-full border-2 transition-all duration-300 ${
                      i < pwd.length 
                        ? (error ? 'bg-red-500 border-red-500' : 'bg-white border-white scale-110 shadow-[0_0_15px_rgba(255,255,255,0.5)]') 
                        : 'border-stone-700'
                    }`}
                  />
                ))}
              </div>

              {/* Keypad */}
              <div className="grid grid-cols-3 gap-6 md:gap-8 relative z-10">
                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                  <button
                    key={num}
                    onClick={() => handleAddDigit(num.toString())}
                    className="w-20 h-20 md:w-24 md:h-24 rounded-full bg-stone-900/50 border border-white/5 backdrop-blur-lg hover:bg-stone-800/80 active:scale-90 flex items-center justify-center text-3xl font-medium text-white transition-all duration-200"
                  >
                    {num}
                  </button>
                ))}
                <div className="w-20 h-20 md:w-24 md:h-24" /> {/* Spacer */}
                <button
                  onClick={() => handleAddDigit('0')}
                  className="w-20 h-20 md:w-24 md:h-24 rounded-full bg-stone-900/50 border border-white/5 backdrop-blur-lg hover:bg-stone-800/80 active:scale-90 flex items-center justify-center text-3xl font-medium text-white transition-all duration-200"
                >
                  0
                </button>
                <button
                  onClick={handleDelete}
                  className={`w-20 h-20 md:w-24 md:h-24 flex items-center justify-center text-base font-bold text-stone-500 hover:text-white transition-all active:scale-95 ${pwd.length === 0 ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
                >
                  Cancella
                </button>
              </div>

              <style>{`
                @keyframes shake {
                  0%, 100% { transform: translateX(0); }
                  20% { transform: translateX(-10px); }
                  40% { transform: translateX(10px); }
                  60% { transform: translateX(-7px); }
                  80% { transform: translateX(7px); }
                }
                .animate-shake {
                  animation: shake 0.4s ease-in-out;
                }
              `}</style>
            </div>
          );
        }

        function VanDiaryApp() {
          const [authed, setAuthed] = useState(() => localStorage.getItem(AUTH_KEY) === '1');
          const [memories, setMemories] = useState([]);
          const [activeTab, setActiveTab] = useState('timeline');
          const [selectedPinInfo, setSelectedPinInfo] = useState(null);
          const [counterEvents, setCounterEvents] = useState([]);
          const [loading, setLoading] = useState(true);
          const [saving, setSaving] = useState(false);
          const [loadError, setLoadError] = useState(false);
          const [gameLevel, setGameLevel] = useState('tutte');
          const [currentQ, setCurrentQ] = useState(null);
          const [qSpin, setQSpin] = useState(false);

          const gameLevels = useMemo(() => [
            { id: 'tutte', label: 'Tutte', icon: 'shuffle', color: 'text-stone-700', bg: 'bg-stone-100/60', hex: '#44403c' },
            { id: 'facile', label: 'Facile', icon: 'face-laugh', color: 'text-emerald-600', bg: 'bg-emerald-100/60', hex: '#059669' },
            { id: 'medio', label: 'Medio', icon: 'users', color: 'text-amber-600', bg: 'bg-amber-100/60', hex: '#d97706' },
            { id: 'difficile', label: 'Estremo', icon: 'skull', color: 'text-red-600', bg: 'bg-red-100/60', hex: '#dc2626' },
          ], []);

          const questionPool = useMemo(() => {
            const all = (typeof window !== 'undefined' && window.VD_QUESTIONS) || [];
            return gameLevel === 'tutte' ? all : all.filter(q => q.l === gameLevel);
          }, [gameLevel]);

          const nextQuestion = () => {
            if (!questionPool.length) { setCurrentQ(null); return; }
            let q = currentQ;
            for (let i = 0; i < 8 && (q === currentQ); i++) {
              q = questionPool[Math.floor(Math.random() * questionPool.length)];
              if (questionPool.length === 1) break;
            }
            setQSpin(true);
            setCurrentQ(q);
            setTimeout(() => setQSpin(false), 220);
          };

          // Nuova domanda al primo accesso e a ogni cambio livello
          useEffect(() => {
            if (questionPool.length) {
              setCurrentQ(questionPool[Math.floor(Math.random() * questionPool.length)]);
            } else {
              setCurrentQ(null);
            }
          }, [gameLevel]);

          const counterConfig = useMemo(() => [
            { key: 'caffe', label: 'Caffè', icon: 'mug-hot', color: 'text-amber-700', bg: 'bg-amber-100/50', border: 'border-amber-200/50', hex: '#b45309' },
            { key: 'bruno', label: 'Bruno', icon: 'dog', color: 'text-orange-600', bg: 'bg-orange-100/50', border: 'border-orange-200/50', hex: '#ea580c' },
            { key: 'bestemmie', label: 'Bestemmie', icon: 'bolt', color: 'text-red-600', bg: 'bg-red-100/50', border: 'border-red-200/50', hex: '#dc2626' },
            { key: 'strada', label: 'Strada sbagliata', icon: 'map-pin', color: 'text-purple-600', bg: 'bg-purple-100/50', border: 'border-purple-200/50', hex: '#9333ea' },
            { key: 'sbadigli', label: 'Sbadigli', icon: 'face-tired', color: 'text-blue-600', bg: 'bg-blue-100/50', border: 'border-blue-200/50', hex: '#2563eb' },
            { key: 'ritardi', label: 'Ritardi', icon: 'clock', color: 'text-yellow-600', bg: 'bg-yellow-100/50', border: 'border-yellow-200/50', hex: '#ca8a04' },
            { key: 'sigarette', label: 'Sigarette', icon: 'smoking', color: 'text-stone-600', bg: 'bg-stone-200/50', border: 'border-stone-300/50', hex: '#57534e' },
            { key: 'pipi', label: 'Soste pipì', icon: 'droplet', color: 'text-cyan-600', bg: 'bg-cyan-100/50', border: 'border-cyan-200/50', hex: '#0891b2' },
            { key: 'alcool', label: 'Alcool', icon: 'wine-glass', color: 'text-rose-600', bg: 'bg-rose-100/50', border: 'border-rose-200/50', hex: '#e11d48' },
            { key: 'scaffe', label: 'Scaffe prese', icon: 'hand-back-fist', color: 'text-pink-600', bg: 'bg-pink-100/50', border: 'border-pink-200/50', hex: '#db2777' },
            { key: 'mutismo', label: 'Mutismo selettivo', icon: 'comment-slash', color: 'text-indigo-600', bg: 'bg-indigo-100/50', border: 'border-indigo-200/50', hex: '#4f46e5' },
            { key: 'banana', label: 'Banana', icon: 'lemon', color: 'text-lime-600', bg: 'bg-lime-100/50', border: 'border-lime-200/50', hex: '#65a30d' },
          ], []);

          // --- CARICAMENTO DA SUPABASE ---
          const loadData = async () => {
            setLoading(true);
            setLoadError(false);
            try {
              const [memRes, evtRes] = await Promise.all([
                sb.from('memories').select('*').order('date'),
                sb.from('counter_events').select('*').order('timestamp')
              ]);
              if (memRes.error || evtRes.error) throw (memRes.error || evtRes.error);
              setMemories((memRes.data || []).map(m => ({ ...m, mediaUrl: m.media_url })));
              setCounterEvents(evtRes.data || []);
            } catch (e) {
              console.error('Errore caricamento dati:', e);
              setLoadError(true);
            } finally {
              setLoading(false);
            }
          };

          useEffect(() => { loadData(); }, []);

          const counters = useMemo(() => {
            const counts = {};
            counterConfig.forEach(conf => { counts[conf.key] = 0; });
            counterEvents.forEach(ev => {
              if (counts[ev.key] !== undefined) counts[ev.key]++;
            });
            return counts;
          }, [counterEvents, counterConfig]);

          // Form State
          const [memoryType, setMemoryType] = useState('photo');
          const [title, setTitle] = useState('');
          const [location, setLocation] = useState('');
          const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
          const [text, setText] = useState('');
          const [mediaFile, setMediaFile] = useState(null);
          const [mediaPreview, setMediaPreview] = useState(null);
          const [memoryCoords, setMemoryCoords] = useState(null);
          const [isLocating, setIsLocating] = useState(false);
          const fileInputRef = useRef(null);
          const mapRef = useRef(null);

          const handleGetLocation = () => {
            setIsLocating(true);
            if ('geolocation' in navigator) {
              navigator.geolocation.getCurrentPosition(
                (pos) => {
                  setMemoryCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
                  setIsLocating(false);
                },
                (err) => {
                  console.warn(err);
                  setIsLocating(false);
                },
                { timeout: 10000 }
              );
            } else {
              setIsLocating(false);
            }
          };

          const handleFileChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              setMediaFile(file);
              const url = URL.createObjectURL(file);
              setMediaPreview(url);
            }
          };

          const handleAddMemory = async (e) => {
            e.preventDefault();
            if (!title || !location || !date) return;
            setSaving(true);

            let mediaUrl = null;

            if (mediaFile) {
              const ext = mediaFile.name.split('.').pop();
              const path = `${Date.now()}.${ext}`;
              const { data: uploadData, error: uploadError } = await sb.storage
                .from('media')
                .upload(path, mediaFile, { contentType: mediaFile.type });
              if (!uploadError) {
                const { data: urlData } = sb.storage.from('media').getPublicUrl(uploadData.path);
                mediaUrl = urlData.publicUrl;
              }
            }

            const newMemory = {
              id: Date.now().toString(),
              type: memoryType,
              title, location, date, text,
              media_url: mediaUrl,
              lat: memoryCoords?.lat || null,
              lng: memoryCoords?.lng || null
            };

            const { data, error } = await sb.from('memories').insert(newMemory).select().single();
            if (!error && data) {
              const memForState = { ...data, mediaUrl: data.media_url };
              setMemories(prev => [...prev, memForState].sort((a, b) => new Date(a.date) - new Date(b.date)));
            }

            setSaving(false);
            setTitle(''); setLocation(''); setText('');
            setMediaFile(null); setMediaPreview(null); setMemoryCoords(null);
            setActiveTab('timeline');
          };

          const deleteMemory = async (id) => {
            if (!confirm('Eliminare questo ricordo?')) return;
            await sb.from('memories').delete().eq('id', id);
            setMemories(memories.filter(m => m.id !== id));
          };

          const handleExportJSON = () => {
            const dataStr = JSON.stringify(memories, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'diario-viaggio-catania-potenza.json');
            linkElement.click();
          };

          const getTypeIcon = (type, className = "text-xl") => {
            switch (type) {
              case 'photo': return <i className={`fa-solid fa-image ${className}`}></i>;
              case 'video': return <i className={`fa-solid fa-video ${className}`}></i>;
              case 'audio': return <i className={`fa-solid fa-microphone ${className}`}></i>;
              case 'text': return <i className={`fa-solid fa-font ${className}`}></i>;
              default: return <i className={`fa-solid fa-compass ${className}`}></i>;
            }
          };

          const handleCounterChange = async (key, delta) => {
            if (delta > 0) {
              const newId = Date.now().toString();
              const now = new Date().toISOString();

              // Aggiorna UI subito (ottimistico)
              setCounterEvents(prev => [...prev, { id: newId, key, lat: null, lng: null, timestamp: now }]);

              // Prova a prendere GPS (max 5s, accetta fix recenti fino a 30s)
              let lat = null, lng = null;
              if ('geolocation' in navigator) {
                try {
                  const pos = await new Promise((resolve, reject) =>
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000, maximumAge: 30000 })
                  );
                  lat = pos.coords.latitude;
                  lng = pos.coords.longitude;
                  setCounterEvents(prev => prev.map(ev => ev.id === newId ? { ...ev, lat, lng } : ev));
                } catch (e) {}
              }

              const { error } = await sb.from('counter_events').insert({ id: newId, key, lat, lng, timestamp: now });
              if (error) {
                console.error('Errore salvataggio counter:', error);
                setCounterEvents(prev => prev.filter(ev => ev.id !== newId));
              }
            } else {
              const copy = [...counterEvents];
              for (let i = copy.length - 1; i >= 0; i--) {
                if (copy[i].key === key) {
                  const { error } = await sb.from('counter_events').delete().eq('id', copy[i].id);
                  if (error) { console.error('Errore eliminazione counter:', error); return; }
                  copy.splice(i, 1);
                  break;
                }
              }
              setCounterEvents(copy);
            }
          };

          // --- STATISTICHE ---
          const stats = useMemo(() => {
            const total = memories.length;
            const locations = new Set(memories.map(m => m.location.toLowerCase().trim())).size;

            const types = { photo: 0, video: 0, audio: 0, text: 0 };
            memories.forEach(m => { if(types[m.type] !== undefined) types[m.type]++; });

            const typePercentages = {
              photo: total ? (types.photo / total) * 100 : 0,
              video: total ? (types.video / total) * 100 : 0,
              audio: total ? (types.audio / total) * 100 : 0,
              text: total ? (types.text / total) * 100 : 0,
            };

            const dates = {};
            memories.forEach(m => { dates[m.date] = (dates[m.date] || 0) + 1; });
            const sortedDates = Object.keys(dates).sort();
            const dateActivity = sortedDates.map(d => ({
              date: new Date(d).toLocaleDateString('it-IT', { day: '2-digit', month: 'short' }),
              count: dates[d]
            }));
            const maxActivity = Math.max(...dateActivity.map(d => d.count), 1);

            return { total, locations, types, typePercentages, dateActivity, maxActivity };
          }, [memories]);

          // --- MAPPA ---
          useEffect(() => {
            let mapInstance = null;
            const initMap = () => {
              if (!mapRef.current || !window.L || activeTab !== 'map') return;

              if (mapRef.current._leaflet_id) {
                mapRef.current._leaflet_id = null;
                mapRef.current.innerHTML = '';
              }

              mapInstance = window.L.map(mapRef.current).setView([39.0, 15.5], 7);
              window.L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap contributors'
              }).addTo(mapInstance);

              const bounds = [];

              memories.forEach(m => {
                if (m.lat && m.lng) {
                  bounds.push([m.lat, m.lng]);
                  const icon = window.L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color: #F97D16; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.15); transition: transform 0.2s;"><div style="width: 8px; height: 8px; background: white; border-radius: 50%;"></div></div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                  });
                  const marker = window.L.marker([m.lat, m.lng], { icon }).addTo(mapInstance);
                  marker.on('click', () => setSelectedPinInfo({ isMemory: true, ...m }));
                }
              });

              counterEvents.forEach(ev => {
                if (ev.lat && ev.lng) {

                          <div className={`w-8 h-8 rounded-lg ${conf.bg} flex items-center justify-center text-xs`}>
                            <i className={`fa-solid fa-${conf.icon} ${conf.color}`}></i>
                          </div>
                          <span className="text-[10px] font-black text-stone-400 uppercase tracking-widest truncate">{conf.label}</span>
                        </div>
                        <div className="text-3xl font-black text-stone-900 ml-1">{counters[conf.key]}</div>
                      </div>
                   ))}
                 </div>
              </div>
            </div>
          );

          const renderGameView = () => {
            const meta = gameLevels.find(l => l.id === (currentQ ? currentQ.l : gameLevel)) || gameLevels[0];
            return (
              <div className="max-w-2xl mx-auto py-6 md:py-8 space-y-6 px-4">
                <div className="flex items-center gap-4 mb-2">
                  <div className="w-14 h-14 bg-fuchsia-100/50 backdrop-blur rounded-[1.5rem] flex items-center justify-center shadow-sm border border-white/60">
                    <i className="fa-solid fa-dice text-2xl text-fuchsia-600"></i>
                  </div>
                  <div>
                    <h2 className="text-2xl md:text-3xl font-black text-stone-900 tracking-tighter leading-none">Il Gioco</h2>
                    <p className="text-stone-500 font-bold text-sm">Una domanda a caso, a turno</p>
                  </div>
                </div>

                {/* Filtro intensità */}
                <div className="flex gap-2 bg-stone-100/50 p-1.5 rounded-2xl">
                  {gameLevels.map(lv => (
                    <button
                      key={lv.id}
                      onClick={() => setGameLevel(lv.id)}
                      className={`flex-1 flex items-center justify-center gap-1.5 py-2.5 px-1 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all ${
                        gameLevel === lv.id ? `bg-white shadow-sm ${lv.color}` : 'text-stone-400 hover:text-stone-600'
                      }`}
                    >
                      <i className={`fa-solid fa-${lv.icon}`}></i>
                      <span>{lv.label}</span>
                    </button>
                  ))}
                </div>

                {/* Card domanda */}
                <div className="glass-card rounded-[2.5rem] border-white/60 shadow-2xl shadow-stone-200/50 p-8 md:p-12 min-h-[300px] flex flex-col items-center justify-center text-center relative overflow-hidden">
                  <div className="absolute -top-16 left-1/2 -translate-x-1/2 w-64 h-64 rounded-full blur-3xl opacity-20 pointer-events-none" style={{ backgroundColor: meta.hex }}></div>
                  {currentQ ? (
                    <>
                      <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest mb-6 relative z-10" style={{ backgroundColor: meta.hex + '22', color: meta.hex }}>
                        <i className={`fa-solid fa-${meta.icon}`}></i> {meta.label}
                      </span>
                      <p className={`text-2xl md:text-3xl font-black text-stone-900 tracking-tight leading-snug relative z-10 transition-all duration-200 ${qSpin ? 'opacity-0 scale-95' : 'opacity-100 scale-100'}`}>
                        {currentQ.t}
                      </p>
                    </>
                  ) : (
                    <p className="text-stone-400 font-bold relative z-10">Nessuna domanda disponibile.</p>
                  )}
                </div>

                {/* Bottone */}
                <button
                  onClick={nextQuestion}
                  className="w-full h-16 bg-stone-900 hover:bg-stone-800 text-white rounded-[1.5rem] font-black text-lg transition-all shadow-xl shadow-stone-300/40 flex items-center justify-center gap-3 active:scale-95"
                >
                  <i className="fa-solid fa-shuffle"></i> Prossima domanda
                </button>
                <p className="text-center text-stone-400 text-[11px] font-bold uppercase tracking-widest">{questionPool.length} domande in questa categoria</p>
              </div>
            );
          };

          const renderOutputView = () => (
            <div id="album-print" className="min-h-screen bg-[#2B2A28] text-stone-100 px-6 py-8 sm:p-10 md:p-12 mx-4 md:mx-0 rounded-[2.5rem] md:rounded-[3rem] shadow-3xl relative overflow-hidden">
              {/* Decorative elements */}
              <div className="absolute top-0 left-0 w-full h-full opacity-20 pointer-events-none">
                 <div className="absolute top-1/4 right-0 w-96 h-96 bg-emerald-600/30 blur-[150px] rounded-full"></div>
                 <div className="absolute bottom-1/4 left-0 w-96 h-96 bg-blue-600/20 blur-[150px] rounded-full"></div>
              </div>

              <div className="max-w-4xl mx-auto relative z-10">
                <header className="text-center mb-16 pt-12">
                  <span className="inline-block px-4 py-1.5 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-emerald-400 text-[10px] font-black uppercase tracking-[0.2em] mb-6">World Tour Experience</span>
                  <h1 className="text-5xl md:text-7xl font-black text-white mb-8 tracking-tighter leading-[0.9]">Album di<br/>Bordo</h1>
                  <div className="flex items-center justify-center gap-4 text-stone-400 text-sm font-bold">
                    <span className="bg-white/5 px-4 py-2 rounded-2xl border border-white/5">Catania</span>
                    <i className="fa-solid fa-arrow-right-long text-emerald-500/50"></i>
                    <span className="bg-white/5 px-4 py-2 rounded-2xl border border-white/5">Potenza</span>
                  </div>
                </header>

                <div className="space-y-24 md:space-y-40 pb-20">
                  {memories.length === 0 && <p className="text-center text-stone-500 text-lg">Nessun capitolo ancora scritto.</p>}
                  {memories.map((memory, idx) => (
                    <article key={memory.id} className="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-16 items-center">
                      <div className={`md:col-span-7 ${idx % 2 === 0 ? 'md:order-1' : 'md:order-2'}`}>
                        {memory.mediaUrl ? (
                          <div className="rounded-[2.5rem] overflow-hidden shadow-[0_30px_60px_-15px_rgba(0,0,0,0.5)] border border-white/10 group">
                            {memory.type === 'photo' && <img src={memory.mediaUrl} className="w-full h-[50vh] md:h-[70vh] object-cover transition-transform duration-1000 group-hover:scale-110" alt="Ricordo" />}
                            {memory.type === 'video' && <video src={memory.mediaUrl} className="w-full h-[50vh] md:h-[70vh] object-cover" controls />}
                            {memory.type === 'audio' && (
                              <div className="bg-white/5 h-48 md:h-64 flex flex-col items-center justify-center p-8">
                                 <i className="fa-solid fa-microphone text-5xl text-emerald-500 mb-6"></i>
                                 <audio src={memory.mediaUrl} controls className="w-full" />
                              </div>
                            )}
                          </div>
                        ) : (
                          <div className="bg-white/5 border border-white/5 rounded-[2.5rem] h-48 md:h-64 flex items-center justify-center">
                             <i className="fa-solid fa-quote-left text-5xl text-stone-800"></i>
                          </div>
                        )}
                      </div>
                      <div className={`md:col-span-5 ${idx % 2 === 0 ? 'md:order-2' : 'md:order-1'}`}>
                        <div className="inline-block px-3 py-1 bg-white/5 border border-white/10 text-stone-400 rounded-lg text-[10px] font-black uppercase tracking-widest mb-6">{memory.date}</div>
                        <h2 className="text-3xl md:text-4xl font-black mb-4 text-white tracking-tighter leading-none">{memory.title}</h2>
                        <div className="flex items-center gap-2 text-emerald-400 mb-8 font-bold text-sm">
                          <i className="fa-solid fa-location-dot"></i> {memory.location}
                        </div>
                        {memory.text && <p className="text-stone-400 text-lg leading-relaxed font-medium">{memory.text}</p>}
                      </div>
                    </article>
                  ))}
                </div>

                {memories.length > 0 && (
                   <footer className="text-center pt-20 border-t border-white/5 pb-20">
                      <div className="flex flex-col sm:flex-row items-center justify-center gap-4 print:hidden">
                        <button onClick={() => window.print()} className="w-full sm:w-auto h-16 px-10 bg-emerald-600 hover:bg-emerald-500 text-white rounded-[1.5rem] font-black text-lg transition-all shadow-xl shadow-emerald-900/40 flex items-center justify-center gap-3 active:scale-95">
                          <i className="fa-solid fa-file-pdf"></i> Salva PDF
                        </button>
                        <button onClick={handleExportJSON} className="w-full sm:w-auto h-16 px-10 bg-white/5 hover:bg-white/10 text-white rounded-[1.5rem] font-black text-lg transition-all border border-white/10 flex items-center justify-center gap-3 active:scale-95">
                          <i className="fa-solid fa-code"></i> JSON Data
                        </button>
                      </div>
                   </footer>
                )}
              </div>
            </div>
          );

          return (
            <div className="min-h-screen pb-32 md:pb-8">

              {/* Header Desktop */}
              <nav className="hidden md:block sticky top-0 z-50 bg-white/70 backdrop-blur-xl border-b border-white/20 px-8 py-4">
                <div className="max-w-6xl mx-auto flex justify-between items-center">
                  <div className="flex items-center gap-4">
                    <div className="bg-emerald-600 w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-600/20">
                      <i className="fa-solid fa-location-arrow text-xl text-white"></i>
                    </div>
                    <div>
                      <h1 className="text-2xl font-black tracking-tighter text-stone-900 leading-none">VanDiary</h1>
                      <span className="text-[10px] font-black text-emerald-600 uppercase tracking-widest">Catania &bull; Potenza</span>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="flex bg-stone-200/50 backdrop-blur p-1.5 rounded-2xl border border-white/50">
                      {[
                        { id: 'timeline', icon: 'list', label: 'Diario' },
                        { id: 'map', icon: 'route', label: 'Mappa' },
                        { id: 'counters', icon: 'hashtag', label: 'Eventi' },
                        { id: 'game', icon: 'dice', label: 'Gioco' },
                        { id: 'stats', icon: 'chart-simple', label: 'Data' },
                        { id: 'output', icon: 'images', label: 'Album' }
                      ].map(tab => (
                        <button
                          key={tab.id}
                          onClick={() => setActiveTab(tab.id)}
                          className={`flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${activeTab === tab.id ? 'bg-white text-emerald-700 shadow-sm border-stone-100 border' : 'text-stone-400 hover:text-stone-800'}`}
                        >
                          <i className={`fa-solid fa-${tab.icon}`}></i> {tab.label}
                        </button>
                      ))}
                    </div>
                    <button
                      onClick={() => setActiveTab('add')}
                      className={`flex items-center gap-2 px-5 py-2.5 rounded-2xl text-xs font-black uppercase tracking-widest transition-all shadow-lg shadow-emerald-600/20 ${activeTab === 'add' ? 'bg-stone-800 text-white' : 'bg-emerald-600 text-white hover:bg-emerald-500'}`}
                    >
                      <i className="fa-solid fa-plus"></i> Nuova
                    </button>
                    <button
                      onClick={() => { localStorage.removeItem(AUTH_KEY); setAuthed(false); }}
                      title="Esci"
                      className="w-11 h-11 rounded-2xl bg-stone-100/80 border border-white text-stone-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition-all"
                    >
                      <i className="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                  </div>
                </div>
              </nav>

              {/* Floating Action Button Mobile */}
              <button
                onClick={() => setActiveTab(activeTab === 'add' ? 'timeline' : 'add')}
                className={`md:hidden fixed bottom-24 right-6 z-[60] w-16 h-16 rounded-[1.8rem] shadow-[0_15px_30px_-5px_rgba(5,150,105,0.4)] flex items-center justify-center transition-all active:scale-90 ${activeTab === 'add' ? 'bg-stone-800 rotate-45' : 'bg-emerald-600'}`}
              >
                <i className={`fa-solid ${activeTab === 'add' ? 'fa-plus' : 'fa-plus'} text-white text-2xl`}></i>
              </button>

              {/* Mobile Navbar: Floating Pill */}
              <nav className="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-[94%] max-w-md h-20 bg-white/80 backdrop-blur-2xl rounded-full border border-white/60 shadow-2xl shadow-stone-300/40 px-3 flex items-center justify-around">
                  {[
                    { id: 'timeline', icon: 'list-ul', label: 'Diario' },
                    { id: 'map', icon: 'map-location-dot', label: 'Mappa' },
                    { id: 'counters', icon: 'hashtag', label: 'Eventi' },
                    { id: 'game', icon: 'dice', label: 'Gioco' },
                    { id: 'stats', icon: 'chart-line', label: 'Data' },
                    { id: 'output', icon: 'images', label: 'Album' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex flex-col items-center justify-center w-12 h-12 rounded-2xl transition-all duration-300 ${activeTab === tab.id ? 'text-emerald-600 scale-110' : 'text-stone-400'}`}
                    >
                      <i className={`fa-solid fa-${tab.icon} text-xl`}></i>
                      <span className={`text-[8px] font-black uppercase tracking-widest mt-1 transition-opacity ${activeTab === tab.id ? 'opacity-100' : 'opacity-0 h-0 overflow-hidden'}`}>{tab.label}</span>
                    </button>
                  ))}
              </nav>

              {/* Mobile Top Header */}
              <div className="md:hidden pt-8 pb-4 px-6 flex items-center justify-between bg-transparent">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-600/20">
                      <i className="fa-solid fa-location-arrow text-white"></i>
                    </div>
                    <h1 className="text-xl font-black tracking-tighter text-stone-900">VanDiary</h1>
                  </div>
                  <button
                    onClick={() => { localStorage.removeItem(AUTH_KEY); setAuthed(false); }}
                    title="Esci"
                    className="w-10 h-10 rounded-xl bg-stone-100/80 backdrop-blur border border-white flex items-center justify-center text-stone-400 active:scale-95 transition-all"
                  >
                    <i className="fa-solid fa-arrow-right-from-bracket"></i>
                  </button>
              </div>

              <main className="max-w-6xl mx-auto md:p-8">
                {activeTab === 'add' && renderAddView()}
                {activeTab === 'map' && renderMapView()}
                {activeTab === 'counters' && renderCountersView()}
                {activeTab === 'game' && renderGameView()}
                {activeTab === 'timeline' && renderTimelineView()}
                {activeTab === 'stats' && renderStatsView()}
                {activeTab === 'output' && renderOutputView()}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VanDiaryApp />);
    </script>

    <!-- Service Worker (offline / installabile / auto-update) -->
    <script>
      if ('serviceWorker' in navigator) {
        let reloading = false;
        // Quando un nuovo SW prende il controllo (nuova versione cache) ricarica una volta.
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            // Controlla aggiornamenti all'avvio e quando la tab torna in primo piano.
            reg.update();
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update();
            });
          }).catch((e) => console.warn('SW non registrato:', e));
        });
      }
    </script>
</body>
</html>
